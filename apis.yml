aid: eu-sovereign-cloud-api

name: Sovereign European Cloud API (SECA)

description: SECA (Sovereign European Cloud API) is an open industry standard API specification for cloud infrastructure management, introduced
  as a collaboration by the European cloud service providers Aruba, IONOS and Dynamo. Built on OpenAPI, it aims to enable sovereign multi-cloud
  deployment of workloads across European public Infrastructure-as-a-Service providers, ensuring interoperability, data sovereignty and freedom
  from vendor lock-in as a building block for the EuroStack. The specification and its tooling are developed openly in the eu-sovereign-cloud
  GitHub organization and documented at spec.secapi.cloud.

