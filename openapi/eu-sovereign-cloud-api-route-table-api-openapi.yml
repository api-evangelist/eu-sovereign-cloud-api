openapi: 3.2.0
info:
  title: Eu Sovereign Cloud Route Table API
  version: v1
  description: 'Operations tagged Route-Table across 2 of this provider''s published API definitions: foundation.network.v1.yaml, eu-sovereign-cloud-api-foundation-network-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo.secapi.cloud/providers/seca.network
  description: Path Schema
- url: https://network.seca.demo.secapi.cloud
  description: DNS Schema
security:
- bearerAuth: []
tags:
- name: Route-Table
  description: Route-Table management
paths:
  /v1/tenants/{tenant}/workspaces/{workspace}/networks/{network}/route-tables:
    get:
      tags:
      - Route-Table
      security:
      - bearerAuth: []
      summary: List route-tables
      description: Lists route-tables and provides paginated, filtered access.
      operationId: listRoute-Tables
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/networkPathParam'
      - $ref: '#/components/parameters/labelSelector'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/skipTokenParam'
      - $ref: '#/components/parameters/acceptHeader'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Route-TableIterator'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    servers:
    - url: https://demo.secapi.cloud/providers/seca.network
      description: Path Schema
    - url: https://network.seca.demo.secapi.cloud
      description: DNS Schema
  /v1/tenants/{tenant}/workspaces/{workspace}/networks/{network}/route-tables/{name}:
    get:
      tags:
      - Route-Table
      security:
      - bearerAuth: []
      summary: Get route-table
      description: 'Get a specific route-table, useful for polling status updates of resources.

        A `404` response without proper schema has to be ignored and must be

        understood as server being unavailable. Only a response with proper schema

        can be trusted.'
      operationId: getRoute-Table
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/networkPathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - Route-Table
      security:
      - bearerAuth: []
      summary: Create or update route-table
      description: 'Creates or updates a route-table. The return code of the endpoint

        provides indicates if the resource was created or updated. A client

        must accept both as successful response to the request.'
      operationId: createOrUpdateRoute-Table
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/networkPathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      requestBody:
        description: 'Any provided `metadata` on the route-table will be ignored by the resource server.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteTable'
      responses:
        '200':
          description: 'Route-Table successfully updated, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '201':
          description: 'Route-Table successfully created, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteTable'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      tags:
      - Route-Table
      security:
      - bearerAuth: []
      summary: Delete route-table
      description: 'Deletes a route-table using the given name. In case the resource workspace

        already deleted `404` is returned. For failure tolerance in case of retry the

        client needs to accept `404` and `202` as a successful deletion. In case the

        client tries to delete a resource for the first time and gets a `404`, the

        resource might not exist for other reasons or never existed in the first

        place. This can''t be assumed as a safe deletion of the resource.

        If deletion of the resource takes longer deletion can be

        issued multiple times with the same result `202`, in all cased the resource

        will be only deleted once. A client must verify the client response to contain

        a proper error schema. A `404` response without proper schema has to be ignored

        and understood as server unavailable error.'
      operationId: deleteRoute-Table
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/networkPathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      responses:
        '202':
          description: Route-Table deletion accepted
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
    servers:
    - url: https://demo.secapi.cloud/providers/seca.network
      description: Path Schema
    - url: https://network.seca.demo.secapi.cloud
      description: DNS Schema
components:
  responses:
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
          example:
            status: 409
            type: http://secapi.cloud/errors/resource-conflict
            title: Conflict
            detail: The request could not be completed due to a conflict with the current state of the resource.
            instance: /errors/409
            sources: []
    Error400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
          example:
            status: 400
            type: http://secapi.cloud/errors/invalid-request
            title: Bad Request
            detail: The request was invalid or cannot be served.
            instance: /errors/400
            sources: []
    Error412:
      description: Precondition Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error412'
          example:
            status: 412
            type: http://secapi.cloud/errors/precondition-failed
            title: Precondition Failed
            detail: The precondition given in the If-Match header failed.
            instance: /errors/412
            sources: []
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          example:
            status: 401
            type: http://secapi.cloud/errors/unauthorized
            title: Unauthorized
            detail: Authentication is required and has failed or has not been provided.
            instance: /errors/401
            sources: []
    Error500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
          example:
            status: 500
            type: http://secapi.cloud/errors/internal-server-error
            title: Internal Server Error
            detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
            instance: /errors/500
            sources: []
    Error422:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error422'
          example:
            status: 422
            type: http://secapi.cloud/errors/validation-error
            title: Unprocessable Entity
            detail: The subnetRef is not correctly formatted.
            sources:
            - pointer: /spec/subnetRef
              parameter: subnet
            instance: /errors/422
    Error404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
          example:
            status: 404
            type: http://secapi.cloud/errors/resource-not-found
            title: Not Found
            detail: The requested resource could not be found.
            instance: /errors/404
            sources: []
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
          example:
            status: 403
            type: http://secapi.cloud/errors/forbidden
            title: Forbidden
            detail: The request was valid, but the server is refusing action.
            instance: /errors/403
            sources: []
  schemas:
    Labels:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to

        organize and categorize resources. They can be used to filter resources.

        The number of labels is eventually limited by the CSP.

        '
      additionalProperties:
        type: string
        maxLength: 63
      example:
        env: production
    Error409:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 409 Conflict error response
      example:
        status: 409
        type: http://secapi.cloud/errors/resource-conflict
        title: Conflict
        detail: The request could not be completed due to a conflict with the current state of the resource.
        instance: /errors/409
        sources: []
    UserResourceMetadata:
      type: object
      description: Metadata for user-defined resource properties
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Annotations'
        extensions:
          $ref: '#/components/schemas/Extensions'
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 403 Forbidden error response
      example:
        status: 403
        type: http://secapi.cloud/errors/forbidden
        title: Forbidden
        detail: The request was valid, but the server is refusing action.
        instance: /errors/403
        sources: []
    NetworkMetadata:
      type: object
      description: Metadata for resources with network constraints
      readOnly: true
      required:
      - network
      properties:
        network:
          type: string
          description: Network identifier
          minLength: 1
          maxLength: 64
    Status:
      type: object
      readOnly: true
      description: Current status of the resource
      required:
      - conditions
      properties:
        state:
          x-go-type-skip-optional-pointer: true
          allOf:
          - $ref: '#/components/schemas/ResourceState'
        conditions:
          type: array
          description: 'History of state transitions, ordered newest-first, complementing the

            current snapshot in `state`.

            '
          maxItems: 32
          items:
            $ref: '#/components/schemas/StatusCondition'
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-items: '32'
    WorkspaceMetadata:
      type: object
      description: Metadata for resources with workspace constraints
      readOnly: true
      required:
      - workspace
      properties:
        workspace:
          type: string
          description: Workspace identifier
          minLength: 1
          maxLength: 64
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 422 Unprocessable Entity error response
      example:
        status: 422
        type: http://secapi.cloud/errors/validation-error
        title: Unprocessable Entity
        detail: The request was well-formed but was unable to be followed due to semantic errors.
        sources:
        - pointer: /data/attributes/username
          parameter: username
        instance: /errors/422
    RouteTableSpec:
      type: object
      description: 'The RouteTableSpec defines the routes that are associated with the route table.

        '
      required:
      - routes
      properties:
        routes:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/RouteSpec'
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-items: '1'
            x-kubebuilder-validation-max-items: '1000'
      example:
        routes:
        - destinationCidrBlock: 0.0.0.0/0
          targetRef:
            resource: internet-gateways/internet-gateway-1
        - destinationCidrBlock: ::/0
          targetRef:
            resource: internet-gateways/internet-gateway-1
    NameMetadata:
      type: object
      readOnly: true
      required:
      - name
      description: Metadata for resource names
      properties:
        name:
          type: string
          description: 'Resource identifier in dash-case (kebab-case) format. Must start and end with an alphanumeric character.

            Can contain lowercase letters, numbers, and hyphens. Multiple segments can be joined with dots.

            Each segment follows the same rules.

            '
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          example: resource-name
    Extensions:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to add extensions.

        Extensions are subject to validation by the CSP, and any value that is not accepted will be rejected during admission.

        '
      additionalProperties:
        type: string
    Error:
      type: object
      description: 'A detailed error response see https://datatracker.ietf.org/doc/html/rfc7807.

        '
      required:
      - type
      - title
      - status
      - detail
      - instance
      - sources
      properties:
        type:
          type: string
          description: The type of error, expressed as a URI.
          minLength: 1
          maxLength: 4000
          example: https://httpstatuses.io/400
        title:
          type: string
          description: 'A short, human-readable summary of the problem

            type.  It SHOULD NOT change from occurrence to occurrence of the

            problem, except for purposes of localization (e.g., using

            proactive content negotiation; see [RFC7231], Section 3.4).

            '
          minLength: 1
          maxLength: 1024
        status:
          type: number
          description: 'The HTTP status type ([http://secapi.cloud/errors/-rfc7231], Section 6)

            generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          minLength: 1
          maxLength: 32768
        instance:
          type: string
          description: 'A URI reference that identifies the specific occurrence of the problem.

            It may or may not yield further information if dereferenced.

            '
          minLength: 1
          maxLength: 256
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          description: A meta object containing non-standard meta-information about the error.
    PermissionMetadata:
      type: object
      readOnly: true
      description: Metadata for permission management
      required:
      - provider
      - resource
      - verb
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
          example: seca.compute/v1
        resource:
          type: string
          minLength: 1
          maxLength: 256
          example: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb:
          type: string
          minLength: 1
          maxLength: 7
          example: get
      example:
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    ResponseMetadata:
      description: 'Metadata for response objects.

        '
      allOf:
      - $ref: '#/components/schemas/PermissionMetadata'
      - type: object
        readOnly: true
        properties:
          skipToken:
            type: string
            description: Opaque cursor to get the next page. Field is omitted when there are no more pages available.
            maxLength: 5
      example:
        skipToken: 'false'
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 500 Internal Server Error error response
      example:
        status: 500
        type: http://secapi.cloud/errors/internal-server-error
        title: Internal Server Error
        detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
        instance: /errors/500
        sources: []
    RouteTable:
      description: 'The RouteTable resource defines a set of routes that can be associated with a network.

        The routes can be used to direct traffic to different targets based on the destination CIDR block.

        '
      allOf:
      - $ref: '#/components/schemas/UserResourceMetadata'
      - type: object
        required:
        - spec
        properties:
          metadata:
            $ref: '#/components/schemas/RegionalNetworkResourceMetadata'
          spec:
            $ref: '#/components/schemas/RouteTableSpec'
          status:
            $ref: '#/components/schemas/RouteTableStatus'
    StatusCondition:
      type: object
      description: 'StatusCondition describes the state of a resource at a certain point.

        Conditions are provider-specific and can represent different states depending on the

        resource type and provider implementation.

        '
      required:
      - state
      - lastTransitionAt
      properties:
        state:
          $ref: '#/components/schemas/ResourceState'
        lastTransitionAt:
          type: string
          format: date-time
          description: 'LastTransitionAt is the last time the condition transitioned from one

            status to another. This should be when the underlying condition changed.

            If that is not known, then using the time when the API field changed is

            acceptable.

            '
        type:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Type of condition. The condition type is provider-specific and should

            reflect the specific states relevant to your resource.

            '
        reason:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'The reason for the condition''s last transition in CamelCase.

            The specific set of reason values is provider-specific and should be

            documented by the provider.

            '
          maxLength: 1024
          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '1024'
            x-kubebuilder-validation-pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
        message:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'A human-readable message indicating details about the transition.

            '
          maxLength: 32768
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '32768'
      example:
        state: active
        lastTransitionAt: '2024-11-21T14:39:22Z'
    Reference:
      type: object
      description: 'A reference to a resource using an object. The object contains the

        same information as the ReferenceURN, but is represented as a structured object.

        The advantage of this representation is that it can be used to reference

        resources in different workspaces or regions without the need to specify

        the full URN.

        '
      required:
      - resource
      properties:
        region:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Region of the resource. If not set, the region is inferred from the context.

            '
          maxLength: 64
          example: eu-central-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        provider:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Provider of the resource. If not set, the provider is inferred from the context.

            '
          maxLength: 64
          example: seca.compute/v1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        tenant:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Tenant of the resource. If not set, the tenant is inferred from the context.

            '
          maxLength: 64
          example: tenant-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        workspace:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Workspace of the resource. If not set, the workspace is inferred from the context.

            '
          maxLength: 64
          example: workspace-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        resource:
          type: string
          description: "Resource-specific path identifying the resource within its workspace context.\nThis is the segment of the full URN after the provider, version, tenant, and\nworkspace parts. For a flat resource it is `<type>/<name>`, and for hierarchical\n(nested) resources it includes the parent path segments:\n  `networks/<network-name>/route-tables/<rt-name>`\nThe provider, tenant, and workspace can be specified as separate fields in this\nobject; they do not need to be repeated here.\n"
          minLength: 1
          maxLength: 256
          example: instances/my-server
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: '1'
            x-kubebuilder-validation-max-length: '256'
    RouteTableStatus:
      description: 'The status of the route table. The status is read-only and will be set by the

        system. The status contains information about the current state of the route table

        and its routes. It will report the status of the routes and the route table as a whole.

        '
      allOf:
      - $ref: '#/components/schemas/Status'
      - type: object
        readOnly: true
        properties:
          routes:
            type: array
            x-go-type-skip-optional-pointer: true
            maxItems: 1000
            items:
              $ref: '#/components/schemas/RouteStatus'
            x-oapi-codegen-extra-tags:
              x-kubebuilder-validation-max-items: '1000'
    RouteSpec:
      type: object
      description: 'The target reference can be an instance,

        a gateway or an IP address (v4 or v6) that is part of the

        network the route table is attached to.

        '
      required:
      - destinationCidrBlock
      - targetRef
      properties:
        destinationCidrBlock:
          type: string
          description: 'The CIDR block for the destination. The block can be

            a specific IP address or a range of addresses. It can be

            IPv6 or IPv4.

            '
          minLength: 1
          maxLength: 43
          example: 0.0.0.0/0
          x-oapi-codegen-extra-tags:
            x-cel-rule-0: isCIDR(self)
            x-cel-message-0: spec.destinationCidrBlock must be a valid CIDR block
            x-kubebuilder-validation-min-length: '1'
            x-kubebuilder-validation-max-length: '43'
        targetRef:
          allOf:
          - $ref: '#/components/schemas/Reference'
          description: Reference to the target of the route. The target can be an instance, an gateway or an IP address.
          example:
            resource: internet-gateways/internet-gateway-1
    Error412:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 412 Precondition Failed error response
      example:
        status: 412
        type: http://secapi.cloud/errors/precondition-failed
        title: Precondition Failed
        detail: The precondition given in the If-Match header failed.
        instance: /errors/412
        sources: []
    Error400:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 400 Bad Request error response
      example:
        status: 400
        type: http://secapi.cloud/errors/invalid-request
        title: Bad Request
        detail: The request was invalid or cannot be served.
        instance: /errors/400
        sources: []
    RouteStatus:
      description: 'The status of the route. The status is read-only and will be set by the

        system. The status contains information about the current state of the route

        and its target. It will report the status of the target and the route as a whole.

        '
      allOf:
      - $ref: '#/components/schemas/Status'
      - type: object
        readOnly: true
        description: 'The status of the route. If the `targetRef` is invalid,

          the status will be `error`. If the route is valid the status

          will be `active`. If the route is referencing a target that

          is not yet created, the status will be `pending`.

          '
        maxProperties: 9
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 404 Not Found error response
      example:
        status: 404
        type: http://secapi.cloud/errors/resource-not-found
        title: Not Found
        detail: The requested resource could not be found.
        instance: /errors/404
        sources: []
    ModificationMetadata:
      type: object
      readOnly: true
      description: Base metadata for all resources with optional region references
      required:
      - createdAt
      - lastModifiedAt
      - resourceVersion
      properties:
        createdAt:
          type: string
          format: date-time
          description: Indicates the time when the resource was created. The field is set by the provider and should not be modified by the user.
