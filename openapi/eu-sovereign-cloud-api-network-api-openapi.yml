openapi: 3.2.0
info:
  title: Eu Sovereign Cloud Network API
  version: v1
  description: 'Operations tagged Network across 2 of this provider''s published API definitions: foundation.network.v1.yaml, eu-sovereign-cloud-api-foundation-network-v1-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://demo.secapi.cloud/providers/seca.network
  description: Path Schema
- url: https://network.seca.demo.secapi.cloud
  description: DNS Schema
security:
- bearerAuth: []
tags:
- name: Network
  description: Network management
paths:
  /v1/tenants/{tenant}/workspaces/{workspace}/networks:
    get:
      tags:
      - Network
      security:
      - bearerAuth: []
      summary: List networks
      description: Lists networks and provides paginated, filtered access.
      operationId: listNetworks
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/labelSelector'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/skipTokenParam'
      - $ref: '#/components/parameters/acceptHeader'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NetworkIterator'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
    servers:
    - url: https://demo.secapi.cloud/providers/seca.network
      description: Path Schema
    - url: https://network.seca.demo.secapi.cloud
      description: DNS Schema
  /v1/tenants/{tenant}/workspaces/{workspace}/networks/{name}:
    get:
      tags:
      - Network
      security:
      - bearerAuth: []
      summary: Get network
      description: 'Get a specific network, useful for polling status updates of resources.

        A `404` response without proper schema has to be ignored and must be

        understood as server being unavailable. Only a response with proper schema

        can be trusted.'
      operationId: getNetwork
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - Network
      security:
      - bearerAuth: []
      summary: Create or update network
      description: 'Creates or updates a network. The return code of the endpoint

        provides indicates if the resource was created or updated. A client

        must accept both as successful response to the request.'
      operationId: createOrUpdateNetwork
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      requestBody:
        description: 'Any provided `metadata` on the network will be ignored by the resource server.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Network'
      responses:
        '200':
          description: 'Network successfully updated, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '201':
          description: 'Network successfully created, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Network'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      tags:
      - Network
      security:
      - bearerAuth: []
      summary: Delete network
      description: 'Deletes the specified network.


        Deletion is not cascading. All child resources of the network (such as

        subnets and route tables) must be deleted first. If the network still

        contains child resources, a `409` is returned.'
      operationId: deleteNetwork
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      responses:
        '202':
          description: Network deletion accepted
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
    servers:
    - url: https://demo.secapi.cloud/providers/seca.network
      description: Path Schema
    - url: https://network.seca.demo.secapi.cloud
      description: DNS Schema
components:
  responses:
    Error409:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
          example:
            status: 409
            type: http://secapi.cloud/errors/resource-conflict
            title: Conflict
            detail: The request could not be completed due to a conflict with the current state of the resource.
            instance: /errors/409
            sources: []
    Error400:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
          example:
            status: 400
            type: http://secapi.cloud/errors/invalid-request
            title: Bad Request
            detail: The request was invalid or cannot be served.
            instance: /errors/400
            sources: []
    Error412:
      description: Precondition Failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error412'
          example:
            status: 412
            type: http://secapi.cloud/errors/precondition-failed
            title: Precondition Failed
            detail: The precondition given in the If-Match header failed.
            instance: /errors/412
            sources: []
    Error401:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          example:
            status: 401
            type: http://secapi.cloud/errors/unauthorized
            title: Unauthorized
            detail: Authentication is required and has failed or has not been provided.
            instance: /errors/401
            sources: []
    Error500:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
          example:
            status: 500
            type: http://secapi.cloud/errors/internal-server-error
            title: Internal Server Error
            detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
            instance: /errors/500
            sources: []
    Error422:
      description: Unprocessable Entity
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error422'
          example:
            status: 422
            type: http://secapi.cloud/errors/validation-error
            title: Unprocessable Entity
            detail: The subnetRef is not correctly formatted.
            sources:
            - pointer: /spec/subnetRef
              parameter: subnet
            instance: /errors/422
    Error404:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
          example:
            status: 404
            type: http://secapi.cloud/errors/resource-not-found
            title: Not Found
            detail: The requested resource could not be found.
            instance: /errors/404
            sources: []
    Error403:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
          example:
            status: 403
            type: http://secapi.cloud/errors/forbidden
            title: Forbidden
            detail: The request was valid, but the server is refusing action.
            instance: /errors/403
            sources: []
  schemas:
    Labels:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to

        organize and categorize resources. They can be used to filter resources.

        The number of labels is eventually limited by the CSP.

        '
      additionalProperties:
        type: string
        maxLength: 63
      example:
        env: production
    NetworkStatus:
      description: 'The status of the network. The status is read-only and will be set by the

        system. The status contains information about the current state of the network

        and its CIDR blocks. It will report the status of the CIDR blocks and the network

        as a whole including automatically assigned IP networks.

        '
      allOf:
      - $ref: '#/components/schemas/Status'
      - type: object
        readOnly: true
        description: 'Current status of the network and its CIDR blocks. Will report

          the status of the CIDR blocks and the network as a whole including

          automatically assigned IP networks.

          '
        required:
        - cidr
        properties:
          cidr:
            allOf:
            - $ref: '#/components/schemas/cidr'
            default:
              ipv4: 0.0.0.0/0
              ipv6: ::/0
            x-oapi-codegen-extra-tags:
              x-kubebuilder-default: '{ipv4: ''0.0.0.0/0'', ipv6: ''::/0''}'
          additionalCidrs:
            type: array
            x-go-type-skip-optional-pointer: true
            maxItems: 32
            items:
              $ref: '#/components/schemas/cidr'
            x-oapi-codegen-extra-tags:
              x-kubebuilder-validation-max-items: '32'
        example:
          cidr:
            ipv4: 10.100.0.0/16
            ipv6: 2001:239:203:2400::/56
    NetworkSpec:
      type: object
      description: 'A Network represents a virtual network that can be used to isolate resources.

        Key network concepts:


        * Defines a range of IP addresses for compute resources (e.g. instances)

        * Enables network segmentation and isolation

        * Provides common performance configuration across the network using a SKU


        The `cidr` is the base CIDR block for the network. Additional CIDR blocks can be

        added to the network using the `additionalCidrs` field. The `additionalCidrs` can

        be changed after the network is created in case they are not used. The main CIDR

        block cannot be changed after the network is created. All cidrs must be non-overlapping.

        The cidrs have to be part of the RFC 1918 address space in case of IPv4 and or RFC 4193.


        In case the system should automatically assign IP addresses to the network cidrs

        only the network prefix is required. E.g. to request a /16 IPv4 CIDR block the

        CIDR block would be `0.0.0.0/16` and for a /56 IPv6 CIDR block the CIDR block would

        be `::/56`. Most CSP will not allow to use a different IPv6 prefix length than /56.


        Route tables associated with this network automatically include local routes for

        all network CIDRs (including `additionalCidrs`). These network-local routes are

        present by default and cannot be removed.

        '
      required:
      - cidr
      - skuRef
      properties:
        cidr:
          $ref: '#/components/schemas/cidr'
        additionalCidrs:
          type: array
          x-go-type-skip-optional-pointer: true
          maxItems: 32
          items:
            $ref: '#/components/schemas/cidr'
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-items: '32'
        skuRef:
          allOf:
          - $ref: '#/components/schemas/Reference'
          description: 'Reference to the SKU used by default for all NIC in this Network.

            Can be overridden by the NIC. The SKU is immutable after the network is created.

            To change the SKU, the network must be deleted and recreated with the new SKU reference.

            '
          example:
            resource: tenants/seca/skus/n1k
          x-oapi-codegen-extra-tags:
            x-cel-rule-0: self == oldSelf
            x-cel-message-0: spec.skuRef is immutable
      example:
        skuRef:
          resource: tenants/seca/skus/n1k
        cidr:
          ipv4: 0.0.0.0/16
          ipv6: ::/56
    UserResourceMetadata:
      type: object
      description: Metadata for user-defined resource properties
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Annotations'
        extensions:
          $ref: '#/components/schemas/Extensions'
    Error409:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 409 Conflict error response
      example:
        status: 409
        type: http://secapi.cloud/errors/resource-conflict
        title: Conflict
        detail: The request could not be completed due to a conflict with the current state of the resource.
        instance: /errors/409
        sources: []
    Error403:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 403 Forbidden error response
      example:
        status: 403
        type: http://secapi.cloud/errors/forbidden
        title: Forbidden
        detail: The request was valid, but the server is refusing action.
        instance: /errors/403
        sources: []
    Status:
      type: object
      readOnly: true
      description: Current status of the resource
      required:
      - conditions
      properties:
        state:
          x-go-type-skip-optional-pointer: true
          allOf:
          - $ref: '#/components/schemas/ResourceState'
        conditions:
          type: array
          description: 'History of state transitions, ordered newest-first, complementing the

            current snapshot in `state`.

            '
          maxItems: 32
          items:
            $ref: '#/components/schemas/StatusCondition'
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-items: '32'
    WorkspaceMetadata:
      type: object
      description: Metadata for resources with workspace constraints
      readOnly: true
      required:
      - workspace
      properties:
        workspace:
          type: string
          description: Workspace identifier
          minLength: 1
          maxLength: 64
    Error422:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 422 Unprocessable Entity error response
      example:
        status: 422
        type: http://secapi.cloud/errors/validation-error
        title: Unprocessable Entity
        detail: The request was well-formed but was unable to be followed due to semantic errors.
        sources:
        - pointer: /data/attributes/username
          parameter: username
        instance: /errors/422
    NameMetadata:
      type: object
      readOnly: true
      required:
      - name
      description: Metadata for resource names
      properties:
        name:
          type: string
          description: 'Resource identifier in dash-case (kebab-case) format. Must start and end with an alphanumeric character.

            Can contain lowercase letters, numbers, and hyphens. Multiple segments can be joined with dots.

            Each segment follows the same rules.

            '
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
          example: resource-name
    Extensions:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to add extensions.

        Extensions are subject to validation by the CSP, and any value that is not accepted will be rejected during admission.

        '
      additionalProperties:
        type: string
    PermissionMetadata:
      type: object
      readOnly: true
      description: Metadata for permission management
      required:
      - provider
      - resource
      - verb
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
          example: seca.compute/v1
        resource:
          type: string
          minLength: 1
          maxLength: 256
          example: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb:
          type: string
          minLength: 1
          maxLength: 7
          example: get
      example:
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    Error:
      type: object
      description: 'A detailed error response see https://datatracker.ietf.org/doc/html/rfc7807.

        '
      required:
      - type
      - title
      - status
      - detail
      - instance
      - sources
      properties:
        type:
          type: string
          description: The type of error, expressed as a URI.
          minLength: 1
          maxLength: 4000
          example: https://httpstatuses.io/400
        title:
          type: string
          description: 'A short, human-readable summary of the problem

            type.  It SHOULD NOT change from occurrence to occurrence of the

            problem, except for purposes of localization (e.g., using

            proactive content negotiation; see [RFC7231], Section 3.4).

            '
          minLength: 1
          maxLength: 1024
        status:
          type: number
          description: 'The HTTP status type ([http://secapi.cloud/errors/-rfc7231], Section 6)

            generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          minLength: 1
          maxLength: 32768
        instance:
          type: string
          description: 'A URI reference that identifies the specific occurrence of the problem.

            It may or may not yield further information if dereferenced.

            '
          minLength: 1
          maxLength: 256
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          description: A meta object containing non-standard meta-information about the error.
    ResponseMetadata:
      description: 'Metadata for response objects.

        '
      allOf:
      - $ref: '#/components/schemas/PermissionMetadata'
      - type: object
        readOnly: true
        properties:
          skipToken:
            type: string
            description: Opaque cursor to get the next page. Field is omitted when there are no more pages available.
            maxLength: 5
      example:
        skipToken: 'false'
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 500 Internal Server Error error response
      example:
        status: 500
        type: http://secapi.cloud/errors/internal-server-error
        title: Internal Server Error
        detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
        instance: /errors/500
        sources: []
    cidr:
      type: object
      description: 'Combined IPv4 and IPv6 CIDR block for a subnet. Depending on the network

        configuration, either the IPv4 or IPv6 range can be omitted. So the following

        combinations are possible:


        * IPv4 only

        * IPv6 only

        * IPv4 and IPv6 (Dual Stack)

        '
      properties:
        ipv4:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'IPv4 CIDR block for the subnet.

            '
          minLength: 9
          maxLength: 18
          example: 10.0.100.0/24
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: '9'
            x-kubebuilder-validation-max-length: '18'
            x-cel-rule-0: self.size() == 0 || (isCIDR(self) && cidr(self).ip().family() == 4)
            x-cel-message-0: cidr.ipv4 must be a valid IPv4 CIDR block
        ipv6:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'IPv6 CIDR block for the subnet.

            '
          minLength: 4
          maxLength: 43
          example: 2001:db8::/32
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: '4'
            x-kubebuilder-validation-max-length: '43'
            x-cel-rule-0: self.size() == 0 || (isCIDR(self) && cidr(self).ip().family() == 6)
            x-cel-message-0: cidr.ipv6 must be a valid IPv6 CIDR block
    StatusCondition:
      type: object
      description: 'StatusCondition describes the state of a resource at a certain point.

        Conditions are provider-specific and can represent different states depending on the

        resource type and provider implementation.

        '
      required:
      - state
      - lastTransitionAt
      properties:
        state:
          $ref: '#/components/schemas/ResourceState'
        lastTransitionAt:
          type: string
          format: date-time
          description: 'LastTransitionAt is the last time the condition transitioned from one

            status to another. This should be when the underlying condition changed.

            If that is not known, then using the time when the API field changed is

            acceptable.

            '
        type:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Type of condition. The condition type is provider-specific and should

            reflect the specific states relevant to your resource.

            '
        reason:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'The reason for the condition''s last transition in CamelCase.

            The specific set of reason values is provider-specific and should be

            documented by the provider.

            '
          maxLength: 1024
          pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '1024'
            x-kubebuilder-validation-pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
        message:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'A human-readable message indicating details about the transition.

            '
          maxLength: 32768
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '32768'
      example:
        state: active
        lastTransitionAt: '2024-11-21T14:39:22Z'
    Reference:
      type: object
      description: 'A reference to a resource using an object. The object contains the

        same information as the ReferenceURN, but is represented as a structured object.

        The advantage of this representation is that it can be used to reference

        resources in different workspaces or regions without the need to specify

        the full URN.

        '
      required:
      - resource
      properties:
        region:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Region of the resource. If not set, the region is inferred from the context.

            '
          maxLength: 64
          example: eu-central-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        provider:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Provider of the resource. If not set, the provider is inferred from the context.

            '
          maxLength: 64
          example: seca.compute/v1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        tenant:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Tenant of the resource. If not set, the tenant is inferred from the context.

            '
          maxLength: 64
          example: tenant-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        workspace:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Workspace of the resource. If not set, the workspace is inferred from the context.

            '
          maxLength: 64
          example: workspace-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        resource:
          type: string
          description: "Resource-specific path identifying the resource within its workspace context.\nThis is the segment of the full URN after the provider, version, tenant, and\nworkspace parts. For a flat resource it is `<type>/<name>`, and for hierarchical\n(nested) resources it includes the parent path segments:\n  `networks/<network-name>/route-tables/<rt-name>`\nThe provider, tenant, and workspace can be specified as separate fields in this\nobject; they do not need to be repeated here.\n"
          minLength: 1
          maxLength: 256
          example: instances/my-server
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: '1'
            x-kubebuilder-validation-max-length: '256'
    NetworkIterator:
      description: Iterator for networks
      type: object
      required:
      - items
      - metadata
      properties:
        items:
          description: List of networks
          type: array
          items:
            $ref: '#/components/schemas/Network'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    Error412:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 412 Precondition Failed error response
      example:
        status: 412
        type: http://secapi.cloud/errors/precondition-failed
        title: Precondition Failed
        detail: The precondition given in the If-Match header failed.
        instance: /errors/412
        sources: []
    Error400:
      allOf:
