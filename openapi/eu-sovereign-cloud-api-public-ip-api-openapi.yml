openapi: 3.2.0
info:
  title: Network Public Ip API
  version: v1
  description: 'The Network Foundation API provides access to network resources, including Networks, NICs, security groups, subnets, and routing tables.

    This API is part of the Sovereign European Cloud API.'
servers:
- url: https://demo.secapi.cloud/providers/seca.network
  description: Path Schema
- url: https://network.seca.demo.secapi.cloud
  description: DNS Schema
security:
- bearerAuth: []
tags:
- name: Public Ip
  description: Public Ip management
paths:
  /v1/tenants/{tenant}/workspaces/{workspace}/public-ips:
    get:
      tags:
      - Public Ip
      security:
      - bearerAuth: []
      summary: List public ips
      description: Lists public ips and provides paginated, filtered access.
      operationId: listPublicIps
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/labelSelector'
      - $ref: '#/components/parameters/limitParam'
      - $ref: '#/components/parameters/skipTokenParam'
      - $ref: '#/components/parameters/acceptHeader'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIpIterator'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /v1/tenants/{tenant}/workspaces/{workspace}/public-ips/{name}:
    get:
      tags:
      - Public Ip
      security:
      - bearerAuth: []
      summary: Get public ip
      description: 'Get a specific public ip, useful for polling status updates of resources.

        A `404` response without proper schema has to be ignored and must be

        understood as server being unavailable. Only a response with proper schema

        can be trusted.'
      operationId: getPublicIp
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIp'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '500':
          $ref: '#/components/responses/Error500'
    put:
      tags:
      - Public Ip
      security:
      - bearerAuth: []
      summary: Create or update public ip
      description: 'Creates or updates a public ip. The return code of the endpoint

        provides indicates if the resource was created or updated. A client

        must accept both as successful response to the request.'
      operationId: createOrUpdatePublicIp
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      requestBody:
        description: 'Any provided `metadata` on the public ip will be ignored by the resource server.

          '
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicIp'
      responses:
        '200':
          description: 'Public Ip successfully updated, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIp'
        '201':
          description: 'Public Ip successfully created, doesn''t indicate successful

            resource provisioning.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicIp'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '422':
          $ref: '#/components/responses/Error422'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      tags:
      - Public Ip
      security:
      - bearerAuth: []
      summary: Delete public ip
      description: 'Deletes a public ip using the given name. In case the resource workspace

        already deleted `404` is returned. For failure tolerance in case of retry the

        client needs to accept `404` and `202` as a successful deletion. In case the

        client tries to delete a resource for the first time and gets a `404`, the

        resource might not exist for other reasons or never existed in the first

        place. This can''t be assumed as a safe deletion of the resource.

        If deletion of the resource takes longer deletion can be

        issued multiple times with the same result `202`, in all cased the resource

        will be only deleted once. A client must verify the client response to contain

        a proper error schema. A `404` response without proper schema has to be ignored

        and understood as server unavailable error.'
      operationId: deletePublicIp
      parameters:
      - $ref: '#/components/parameters/tenantPathParam'
      - $ref: '#/components/parameters/workspacePathParam'
      - $ref: '#/components/parameters/resourcePathParam'
      - $ref: '#/components/parameters/ifUnmodifiedSince'
      responses:
        '202':
          description: Public Ip deletion accepted
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '412':
          $ref: '#/components/responses/Error412'
        '500':
          $ref: '#/components/responses/Error500'
components:
  parameters:
    labelSelector:
      in: query
      name: labels
      description: "Filter resources by their labels. Multiple filters are combined with comma.\nFilter syntax:\n  - Equals: key=value\n  - Not equals: key!=value\n  - Wildcards: \\*key\\*=\\*value\\* - substring (contains) match on both key and value. Each `*` can appear at start, end or in the middle to mean \"any characters\". Example: \\*env\\*=\\*prod\\* matches a label key containing \"env\" whose value contains \"prod\".\n  - Numeric: key>value, key<value, key>=value, key<=value\n  - Namespaced key examples: 'monitoring:alert-level=high' or 'billing:team=platform'\n"
      required: false
      schema:
        type: string
        example: cloud:region=us-east-1,billing:team=platform,tier!=dev
    ifUnmodifiedSince:
      in: header
      name: if-unmodified-since
      schema:
        type: integer
      required: false
      description: 'Returns resources only if they have not been modified since the specified version.

        Uses metadata.resourceVersion for comparison.

        '
    resourcePathParam:
      name: name
      in: path
      required: true
      schema:
        type: string
        maxLength: 128
        minLength: 1
        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
      description: Resource name
    tenantPathParam:
      name: tenant
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: Tenant ID
    limitParam:
      in: query
      name: limit
      description: Maximum number of resources to return in the response
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1000
    acceptHeader:
      in: header
      name: Accept
      schema:
        type: string
        default: application/json
        example: application/json; deleted=true
        enum:
        - application/json
        - application/json; deleted=true
        - application/json; deleted=only
        x-enumNames:
        - AcceptHeaderJson
        - AcceptHeaderJsonDeletedTrue
        - AcceptHeaderJsonDeletedOnly
      description: 'Controls whether deleted resources are included:

        - `"application/json"`: Returns only non-deleted resources

        - `"application/json; deleted=true"`: Returns both deleted and non-deleted resources

        - `"application/json; deleted=only"`: Returns only deleted resources

        '
    workspacePathParam:
      name: workspace
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 64
      description: Workspace name
    skipTokenParam:
      in: query
      name: skipToken
      description: Opaque cursor for pagination. Use the skipToken from the previous response to get the next page of results. Note that skipTokens do not guarantee consistency across pages if the underlying data changes between requests
      required: false
      schema:
        type: string
  schemas:
    Labels:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to

        organize and categorize resources. They can be used to filter resources.

        The number of labels is eventually limited by the CSP.

        '
      additionalProperties:
        type: string
        maxLength: 63
      example:
        env: production
    PublicIp:
      description: 'Public IP resource.

        '
      allOf:
      - $ref: '#/components/schemas/UserResourceMetadata'
      - type: object
        description: 'Represents a public IP address that can be assigned to network

          resources. A CSP might enable Bring Your Own IP (BYOIP) where

          the IP address are made available.

          '
        required:
        - spec
        properties:
          metadata:
            $ref: '#/components/schemas/RegionalWorkspaceResourceMetadata'
          spec:
            $ref: '#/components/schemas/PublicIpSpec'
          status:
            $ref: '#/components/schemas/PublicIpStatus'
    TypeMetadata:
      type: object
      readOnly: true
      required:
      - apiVersion
      - kind
      - ref
      description: 'Metadata for all resources with type information.

        '
      properties:
        apiVersion:
          type: string
          description: API version of the resource
          minLength: 1
          maxLength: 16
          default: v1
        kind:
          type: string
          description: Type of the resource
          enum:
          - activity-log
          - block-storage
          - image
          - instance
          - instance-sku
          - internet-gateway
          - network
          - network-load-balancer
          - network-sku
          - nic
          - object-storage-account
          - public-ip
          - region
          - role
          - role-assignment
          - routing-table
          - security-group
          - security-group-rule
          - storage-sku
          - subnet
          - workspace
          x-enumNames:
          - ResourceKindActivityLog
          - ResourceKindBlockStorage
          - ResourceKindImage
          - ResourceKindInstance
          - ResourceKindInstanceSku
          - ResourceKindInternetGateway
          - ResourceKindNetwork
          - ResourceKindNetworkLoadBalancer
          - ResourceKindNetworkSku
          - ResourceKindNic
          - ResourceKindObjectStorageAccount
          - ResourceKindPublicIP
          - ResourceKindRegion
          - ResourceKindRole
          - ResourceKindRoleAssignment
          - ResourceKindRoutingTable
          - ResourceKindSecurityGroup
          - ResourceKindSecurityGroupRule
          - ResourceKindStorageSku
          - ResourceKindSubnet
          - ResourceKindWorkspace
        ref:
          $ref: '#/components/schemas/ReferenceURN'
    Error404:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 404 Not Found error response
      example:
        status: 404
        type: http://secapi.cloud/errors/resource-not-found
        title: Not Found
        detail: The requested resource could not be found.
        instance: /errors/404
        sources: []
    Status:
      type: object
      readOnly: true
      description: Current status of the resource
      required:
      - conditions
      properties:
        state:
          x-go-type-skip-optional-pointer: true
          allOf:
          - $ref: '#/components/schemas/ResourceState'
        conditions:
          type: array
          description: 'History of state transitions, ordered newest-first, complementing the

            current snapshot in `state`.

            '
          maxItems: 32
          items:
            $ref: '#/components/schemas/StatusCondition'
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-items: '32'
    PublicIpStatus:
      description: 'Status of the public IP.

        '
      allOf:
      - $ref: '#/components/schemas/Status'
      - type: object
        readOnly: true
        description: 'Current status of the public IP.

          Condition type `allocation` indicates the status of the public IP allocation.

          The status can be `allocated` or `released`.

          Condition type  `binding` indicates the status of the IP binding to a resource.

          The status can be `bound` or `unbound`.

          '
        properties:
          attachedTo:
            allOf:
            - $ref: '#/components/schemas/Reference'
            description: Reference to the instance the public IP is attached to.
            example:
              provider: seca.compute/v1
              resource: instances/instance-123
              ref: seca.compute/v1/tenants/tn-1/workspaces/ws-1/instances/instance-123
          ipAddress:
            type: string
            x-go-type-skip-optional-pointer: true
            description: The public IP address in case of BYOIP.
            maxLength: 39
            x-oapi-codegen-extra-tags:
              x-cel-rule-0: self.size() == 0 || isIP(self)
              x-cel-message-0: status.ipAddress must be a valid IPv4/IPv6 address
              x-kubebuilder-validation-max-length: '39'
    UserResourceMetadata:
      type: object
      description: Metadata for user-defined resource properties
      properties:
        labels:
          $ref: '#/components/schemas/Labels'
        annotations:
          $ref: '#/components/schemas/Annotations'
        extensions:
          $ref: '#/components/schemas/Extensions'
    Error412:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 412 Precondition Failed error response
      example:
        status: 412
        type: http://secapi.cloud/errors/precondition-failed
        title: Precondition Failed
        detail: The precondition given in the If-Match header failed.
        instance: /errors/412
        sources: []
    WorkspaceMetadata:
      type: object
      description: Metadata for resources with workspace constraints
      readOnly: true
      required:
      - workspace
      properties:
        workspace:
          type: string
          description: Workspace identifier
          minLength: 1
          maxLength: 64
    RegionalWorkspaceResourceMetadata:
      description: 'Metadata for regional resources with name, permission, modification, type, tenant and workspace and region information.

        '
      allOf:
      - $ref: '#/components/schemas/NameMetadata'
      - $ref: '#/components/schemas/PermissionMetadata'
      - $ref: '#/components/schemas/ModificationMetadata'
      - $ref: '#/components/schemas/TypeMetadata'
      - $ref: '#/components/schemas/TenantMetadata'
      - $ref: '#/components/schemas/WorkspaceMetadata'
      - $ref: '#/components/schemas/RegionalMetadata'
    Extensions:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to add extensions.

        Extensions are subject to validation by the CSP, and any value that is not accepted will be rejected during admission.

        '
      additionalProperties:
        type: string
    PublicIpSpec:
      type: object
      description: 'Specification of the public IP.

        '
      required:
      - version
      properties:
        version:
          $ref: '#/components/schemas/IPVersion'
        address:
          type: string
          x-go-type-skip-optional-pointer: true
          description: The public IP address in case of BYOIP.
          maxLength: 39
          x-oapi-codegen-extra-tags:
            x-cel-rule-0: self.size() == 0 || isIP(self)
            x-cel-message-0: spec.address must be a valid IPv4/IPv6 address
            x-kubebuilder-validation-max-length: '39'
      example:
        version: IPv4
    PublicIpIterator:
      description: Iterator for public ips
      type: object
      required:
      - items
      - metadata
      properties:
        items:
          description: List of public ips
          type: array
          items:
            $ref: '#/components/schemas/PublicIp'
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'
    Annotations:
      x-go-type-skip-optional-pointer: true
      type: object
      description: 'User-defined key/value pairs that are mutable and can be used to add annotations.

        The number of annotations is eventually limited by the CSP.

        '
      additionalProperties:
        type: string
        maxLength: 1024
      example:
        description: Human readable description
    ReferenceURN:
      type: string
      minLength: 1
      description: "A unique resource name (URN) used to identify and reference this resource.\n\nThe URN is NOT a URL — it does not contain a protocol scheme (http/https), a host,\nor any endpoint-specific prefix. It is a portable, transport-agnostic identifier.\nA configured SDK client — which knows the provider's base URL and endpoint mapping —\ncan derive a URL from a URN, but the URN alone cannot be turned into a URL without\nthat SDK configuration context. This separation keeps the URN portable across\nenvironments and CSP deployments.\n\nThe full URN format is:\n  `{provider}/{version}/tenants/{tenant}/workspaces/{workspace}/{type}/{name}`\n\nFor hierarchical (nested) resources, additional parent path segments are included:\n  `seca.network/v1/tenants/tn-1/workspaces/ws-1/networks/my-net/route-tables/my-rt`\n\n### Automatic Prefix Inference\n\nIn most cases, the prefix of the URN can be automatically derived in the given context.\nTo simplify usage, only the resource type and name might be specified as a reference\nusing the `<type>/<name>` notation. The suffix can be made more specific by adding\nadditional segments separated by slashes.\n\nThe prefix is automatically inferred from the context. For example, if the resource is a\nblock storage in the same workspace the reference can be specified as\n`block-storages/my-block-storage`. If the resource is a block storage in a different workspace, the\nreference can be specified as `workspaces/ws-1/block-storages/my-block-storage`.\n\nFor automatic prefix inference, the following rules apply:\n- the version is inferred from the current resource version\n- the workspace is inferred from the current workspace\n- the region is inferred from the current region\n- the provider is inferred from the type and context of the usage\n\nThe prefix inference is resolved on admission into the full URN format, which makes it\nmostly suitable for human use.\n"
      maxLength: 255
      example: seca.compute/v1/tenants/tn-1/workspaces/ws-1/instances/my-server
    ResponseMetadata:
      description: 'Metadata for response objects.

        '
      allOf:
      - $ref: '#/components/schemas/PermissionMetadata'
      - type: object
        readOnly: true
        properties:
          skipToken:
            type: string
            description: Opaque cursor to get the next page. Field is omitted when there are no more pages available.
            maxLength: 5
      example:
        skipToken: 'false'
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    Reference:
      type: object
      description: 'A reference to a resource using an object. The object contains the

        same information as the ReferenceURN, but is represented as a structured object.

        The advantage of this representation is that it can be used to reference

        resources in different workspaces or regions without the need to specify

        the full URN.

        '
      required:
      - resource
      properties:
        region:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Region of the resource. If not set, the region is inferred from the context.

            '
          maxLength: 64
          example: eu-central-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        provider:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Provider of the resource. If not set, the provider is inferred from the context.

            '
          maxLength: 64
          example: seca.compute/v1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        tenant:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Tenant of the resource. If not set, the tenant is inferred from the context.

            '
          maxLength: 64
          example: tenant-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        workspace:
          type: string
          x-go-type-skip-optional-pointer: true
          description: 'Workspace of the resource. If not set, the workspace is inferred from the context.

            '
          maxLength: 64
          example: workspace-1
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-max-length: '64'
        resource:
          type: string
          description: "Resource-specific path identifying the resource within its workspace context.\nThis is the segment of the full URN after the provider, version, tenant, and\nworkspace parts. For a flat resource it is `<type>/<name>`, and for hierarchical\n(nested) resources it includes the parent path segments:\n  `networks/<network-name>/route-tables/<rt-name>`\nThe provider, tenant, and workspace can be specified as separate fields in this\nobject; they do not need to be repeated here.\n"
          minLength: 1
          maxLength: 256
          example: instances/my-server
          x-oapi-codegen-extra-tags:
            x-kubebuilder-validation-min-length: '1'
            x-kubebuilder-validation-max-length: '256'
    RegionalMetadata:
      type: object
      description: Metadata for regional resources
      readOnly: true
      required:
      - region
      properties:
        region:
          type: string
          description: Reference to the region where the resource is located
          minLength: 1
          maxLength: 64
          example: eu-central-1
    IPVersion:
      type: string
      description: IP version of the address
      enum:
      - IPv4
      - IPv6
      x-enumNames:
      - IPVersionIPv4
      - IPVersionIPv6
      x-oapi-codegen-extra-tags:
        x-kubebuilder-validation-enum: IPv4;IPv6
    PermissionMetadata:
      type: object
      readOnly: true
      description: Metadata for permission management
      required:
      - provider
      - resource
      - verb
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 64
          example: seca.compute/v1
        resource:
          type: string
          minLength: 1
          maxLength: 256
          example: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb:
          type: string
          minLength: 1
          maxLength: 7
          example: get
      example:
        provider: seca.compute/v1
        resource: tenants/tn-1/workspaces/ws-1/instances/my-server
        verb: get
    ModificationMetadata:
      type: object
      readOnly: true
      description: Base metadata for all resources with optional region references
      required:
      - createdAt
      - lastModifiedAt
      - resourceVersion
      properties:
        createdAt:
          type: string
          format: date-time
          description: Indicates the time when the resource was created. The field is set by the provider and should not be modified by the user.
        deletedAt:
          type: string
          format: date-time
          description: If set, indicates the time when the resource was marked for deletion. Resources with this field set are considered pending deletion.
        lastModifiedAt:
          type: string
          format: date-time
          description: Indicates the time when the resource was created or last modified. Field is used for "If-Unmodified-Since" logic for concurrency control. The provider guarantees that a modification on a single resource can happen only once every millisecond.
        resourceVersion:
          type: integer
          description: Incremented on every modification of the resource. Used for optimistic concurrency control.
          minimum: 1
          format: int64
    Error409:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 409 Conflict error response
      example:
        status: 409
        type: http://secapi.cloud/errors/resource-conflict
        title: Conflict
        detail: The request could not be completed due to a conflict with the current state of the resource.
        instance: /errors/409
        sources: []
    Error:
      type: object
      description: 'A detailed error response see https://datatracker.ietf.org/doc/html/rfc7807.

        '
      required:
      - type
      - title
      - status
      - detail
      - instance
      - sources
      properties:
        type:
          type: string
          description: The type of error, expressed as a URI.
          minLength: 1
          maxLength: 4000
          example: https://httpstatuses.io/400
        title:
          type: string
          description: 'A short, human-readable summary of the problem

            type.  It SHOULD NOT change from occurrence to occurrence of the

            problem, except for purposes of localization (e.g., using

            proactive content negotiation; see [RFC7231], Section 3.4).

            '
          minLength: 1
          maxLength: 1024
        status:
          type: number
          description: 'The HTTP status type ([http://secapi.cloud/errors/-rfc7231], Section 6)

            generated by the origin server for this occurrence of the problem.

            '
          minimum: 100
          maximum: 599
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          minLength: 1
          maxLength: 32768
        instance:
          type: string
          description: 'A URI reference that identifies the specific occurrence of the problem.

            It may or may not yield further information if dereferenced.

            '
          minLength: 1
          maxLength: 256
        sources:
          type: array
          maxItems: 32
          items:
            $ref: '#/components/schemas/ErrorSource'
        meta:
          type: object
          description: A meta object containing non-standard meta-information about the error.
    Error500:
      allOf:
      - $ref: '#/components/schemas/Error'
      description: A 500 Internal Server Error error response
      example:
        status: 500
        type: http://secapi.cloud/errors/internal-server-error
        title: Internal Server Error
        detail: The server encountered an unexpected condition that prevented it from fulfilling the request.
        instance: /errors/500
        sources: []
    ResourceState:
      type: string
      description: 'Current phase of the resource:

        - pending: not available, waiting for other resources

        - creating: not available, creation started

        - active: available for data layer usage

        - updating: available for data layer usage

        - deleting: maybe still available for data layer user, can fail any moment

