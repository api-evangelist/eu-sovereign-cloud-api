name: SECA Lifecycle
versioning:
  scheme: 'Per-resource API versions inspired by Kubernetes: vXalphaY, vXbetaY, vX'
  location: URL path (provider segment, e.g. seca.compute/v1)
  stages:
    alpha: early-stage features that are experimental ... subject to breaking changes, meaning they may change or
      be removed entirely
    beta: stable enough for more extensive testing but may still have breaking changes ... expected to stay around
      for at least a few releases
    stable: production-ready and highly stable. Changes here are rare, non-breaking, and backward-compatible.
